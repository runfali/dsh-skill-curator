# dsh-skill-curator 自动技能策展 bundle 插件（dsh 0.1.7 适配）
#
# 安装（标准 bundle 插件，不改 dsh 源码；安装/卸载后重启 dsh 生效）：
#   dsh plugin --profile web add ./dsh-skill-curator
# 卸载：
#   dsh plugin --profile web remove dsh-skill-curator
#
# 功能：
#   1. 每 N 轮对话（默认 3）后，后台起一个评审子代理阅读会话历史，
#      自主增删改 ~/.dsh/skills/ 下的 SKILL.md（中文正文 + 双语描述）
#   2. 评审子代理被 toolFilter 白名单限制，只能调用插件注册的
#      skill-library-* 工具（list/read/create/patch/write-file/delete/adopt），
#      其他工具在子代理 prompt 与执行层均不可见
#   3. 设置 → 技能策展 卡片：开关/间隔/通知/模型覆盖/保护名单（热改即生效）
#   4. 安全网：写前必须 skill-library-read 回传 sha256（先读后改），
#      每次写入/删除前自动备份到 <DSH_HOME>/skill-curator/backups/
#
# ⚠️ 行 id 必须是 skill-curator：dsh 0.1.7 起设置命名空间 = cordis 行 id
#    （installSection 已移除），改名会让宿主的设置视图与插件页面错位。
#
# 配置覆盖（追加到 ~/.dsh/profiles/<profile>/cordis.patch.yml，整段替换 config）：
# - id: skill-curator
#   config:
#     skillsRoot: ""     # 技能根目录；空 = <DSH_HOME>/skills

- insert:
    - id: skill-curator
      name: 'dsh-skill-curator'
      config:
        skillsRoot: ""

    # 评审子代理专用的 Agent Preset（dsh 0.2.1+ 的工具白名单载体）。
    #
    # 为什么必须走 preset：0.2.1 起宿主 `startLocal` 只把 agentPreset 写进 child
    # composition，**`request.toolFilter` 全树零读取点**（0.2.0 的 startContinuable
    # 会读它）；同时 dsh-tool-subagent 对 config.toolFilter 直接抛错并指向 preset。
    # 不接这条，评审子代理会拿到父组合的全部工具（含 shell），而它读的是完整会话摘要。
    #
    # 机制：preset 独立挂载 → 子代理不继承父 preset 的工具面，只看到 global 层；
    # preset 内挂 preset-guard 在**子代理自己的 scope** 上调 tools.restrict()，
    # 把 global 面收敛到 skill-library-*。restrict 过滤的是继承面，
    # 不影响本层注册 —— 与宿主 applyChildOverrides 同源语义。
    #
    # order=99：排在官方 preset 之后，避免误占默认选择位。
    # 名字带「勿选」：宿主没有 hidden 标记，它会出现在 preset 选择器里。
    - id: preset-skill-curator-review
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: skill-curator-review
        name: '技能评审（内部，勿选）'
        description: 'skill-curator 评审子代理专用：工具面被限制为 skill-library-*。手选此 preset 会失去常规工具。'
        order: 99
        plugins:
          - id: preset-guard
            name: 'dsh-skill-curator/preset-guard'
